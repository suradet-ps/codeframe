[package]
name = "codeframe-app"
description = "Leptos CSR frontend for CodeFrame"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codeframe"
path = "src/main.rs"

[dependencies]
codeframe-models = { path = "../models" }
codeframe-highlighter = { path = "../highlighter" }
codeframe-renderer = { path = "../renderer" }
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
thiserror = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = [
    "Blob",
    "CanvasRenderingContext2d",
    "Clipboard",
    "ClipboardItem",
    "Document",
    "Element",
    "FontFaceSet",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Navigator",
    "Storage",
    "Url",
    "Window",
] }
