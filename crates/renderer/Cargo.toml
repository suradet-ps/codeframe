[package]
name = "codeframe-renderer"
description = "Pure canvas-drawing logic; knows nothing about Leptos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
codeframe-models = { path = "../models" }
thiserror = "2"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasGradient",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "TextMetrics",
] }
